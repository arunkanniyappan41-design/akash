<!DOCTYPE html>
<html>
<head>
<title>Number Guessing Game</title>
<style>
body{font-family:Arial; background:#111; color:#fff; text-align:center; padding-top:50px;}
.box{background:#222; padding:30px; border-radius:15px; width:300px; margin:auto;}
input{padding:10px; width:80%; border-radius:8px; border:none; margin:10px 0;}
button{padding:10px 20px; background:#00ff88; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
#msg{margin-top:15px; font-size:18px;}
</style>
</head>
<body>
<div class="box">
<h2>🎯 Guess The Number (1-100)</h2>
<input type="number" id="guess" placeholder="Enter number">
<br>
<button onclick="check()">Guess</button>
<p id="msg">Start pannu da Akash!</p>
<p>Attempts: <span id="count">0</span></p>
</div>

<script>
let randomNum = Math.floor(Math.random()*100)+1;
let attempts = 0;
function check(){
let g = document.getElementById("guess").value;
attempts++;
document.getElementById("count").innerText = attempts;
if(g == randomNum){
document.getElementById("msg").innerText = "🎉 SEMMA DA! Correct! " + randomNum;
document.getElementById("msg").style.color = "#00ff88";
}else if(g < randomNum){
document.getElementById("msg").innerText = "📈 Periya number try pannu!";
}else{
document.getElementById("msg").innerText = "📉 Chinna number try pannu!";
}
}
</script>
</body>
</html>
